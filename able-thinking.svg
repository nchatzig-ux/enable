<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Able - Thinking/Curious variation -->
  
  <!-- Shadow/ground -->
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="#48BFE3" opacity="0.2" />
  
  <!-- Main body - slightly tilted to suggest pondering -->
  <path d="M48 152 C22 138, 15 97, 38 62 C53 40, 87 25, 117 28 C150 32, 175 54, 172 90 C170 113, 158 137, 142 153 C122 170, 72 168, 48 152 Z" 
        fill="#48BFE3" />
  
  <!-- Body highlight -->
  <path d="M63 53 C80 37, 107 31, 128 37 C143 42, 152 53, 150 63 C142 52, 121 44, 97 42 C79 41, 67 46, 63 53 Z" 
        fill="#72EFDD" opacity="0.4" />
  
  <!-- Left eyebrow - slightly furrowed/curious -->
  <path d="M68 62 C74 58, 87 57, 94 61" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Right eyebrow - raised higher (asymmetric for curiosity) -->
  <path d="M122 55 C128 50, 140 49, 148 54" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Left eye - normal, looking up-right -->
  <ellipse cx="84" cy="82" rx="14" ry="16" fill="white" />
  <ellipse cx="88" cy="80" rx="7" ry="8" fill="#5E60CE" />
  <ellipse cx="88" cy="80" rx="5" ry="6" fill="#3A0CA3" />
  <circle cx="91" cy="76" r="2.5" fill="white" />
  <circle cx="85" cy="83" r="1.5" fill="white" opacity="0.6" />
  
  <!-- Right eye - slightly squinted (thinking) -->
  <ellipse cx="137" cy="78" rx="14" ry="14" fill="white" />
  <ellipse cx="140" cy="77" rx="7" ry="7" fill="#5E60CE" />
  <ellipse cx="140" cy="77" rx="5" ry="5" fill="#3A0CA3" />
  <circle cx="143" cy="73" r="2.5" fill="white" />
  <circle cx="137" cy="80" r="1.5" fill="white" opacity="0.6" />
  
  <!-- Nose -->
  <ellipse cx="110" cy="98" rx="4" ry="3" fill="#3AB8D8" />
  
  <!-- Mouth - small thoughtful "hmm" shape -->
  <path d="M100 118 C106 118, 112 120, 118 118 C122 117, 125 115, 128 116" 
        fill="none" stroke="#5E60CE" stroke-width="2.8" stroke-linecap="round" />
  
  <!-- Cheek blush -->
  <ellipse cx="67" cy="103" rx="8" ry="5" fill="#80FFDB" opacity="0.35" />
  <ellipse cx="152" cy="98" rx="8" ry="5" fill="#80FFDB" opacity="0.35" />
  
  <!-- Hand on chin - thinking pose -->
  <path d="M125 128 C130 125, 138 122, 142 126 C146 130, 143 136, 138 138 C134 140, 128 136, 125 128 Z" 
        fill="#56CFE1" />
  
  <!-- Thought bubble -->
  <circle cx="170" cy="42" r="8" fill="white" stroke="#72EFDD" stroke-width="1.5" />
  <circle cx="183" cy="28" r="11" fill="white" stroke="#72EFDD" stroke-width="1.5" />
  <circle cx="162" cy="55" r="4" fill="white" stroke="#72EFDD" stroke-width="1" />
  <circle cx="158" cy="62" r="2.5" fill="white" stroke="#72EFDD" stroke-width="1" />
  
  <!-- Question mark / lightbulb hint inside thought bubble -->
  <text x="178" y="33" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5E60CE" text-anchor="middle">?</text>
  
  <!-- Subtle floating dots suggesting processing -->
  <circle cx="30" cy="60" r="2" fill="#72EFDD" opacity="0.4" />
  <circle cx="25" cy="80" r="1.5" fill="#80FFDB" opacity="0.3" />
  <circle cx="35" cy="45" r="1.5" fill="#80FFDB" opacity="0.3" />
</svg>