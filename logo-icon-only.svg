<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Able - Icon Only Version (compact, centered for avatar/favicon use) -->
  
  <!-- Main body - asymmetric blob shape suggesting movement/bounce -->
  <path d="M60 140 C30 130, 20 95, 40 65 C55 40, 90 30, 120 35 C150 40, 175 60, 170 90 C167 110, 155 130, 140 145 C120 162, 80 155, 60 140 Z" 
        fill="#48BFE3" />
  
  <!-- Movement trail / energy swoosh -->
  <path d="M35 105 C20 100, 15 85, 25 72 C30 65, 28 75, 22 82 C16 92, 20 100, 35 105 Z" 
        fill="#72EFDD" opacity="0.7" />
  <path d="M28 120 C18 118, 14 110, 18 102 C20 98, 19 105, 16 109 C13 114, 16 118, 28 120 Z" 
        fill="#80FFDB" opacity="0.5" />
  
  <!-- Face - friendly eyes -->
  <!-- Left eye -->
  <ellipse cx="90" cy="82" rx="10" ry="12" fill="white" />
  <ellipse cx="92" cy="84" rx="5" ry="6" fill="#5E60CE" />
  <circle cx="94" cy="81" r="2" fill="white" />
  
  <!-- Right eye -->
  <ellipse cx="130" cy="78" rx="10" ry="12" fill="white" />
  <ellipse cx="132" cy="80" rx="5" ry="6" fill="#5E60CE" />
  <circle cx="134" cy="77" r="2" fill="white" />
  
  <!-- Friendly smile -->
  <path d="M95 108 C105 120, 125 120, 135 108" 
        fill="none" stroke="#5E60CE" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Small raised hand/wave suggesting friendliness -->
  <path d="M160 60 C165 50, 172 48, 176 52 C180 56, 178 64, 172 68 C168 71, 163 68, 160 60 Z" 
        fill="#56CFE1" />
  
  <!-- Speech bubble dots - representing language/communication -->
  <circle cx="175" cy="42" r="4" fill="#72EFDD" />
  <circle cx="182" cy="34" r="3" fill="#80FFDB" />
  <circle cx="186" cy="25" r="2.5" fill="#80FFDB" opacity="0.7" />
</svg>