<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Able - Speaking/Talking variation (perfect for conversation/dialogue content) -->
  
  <!-- Shadow/ground -->
  <ellipse cx="100" cy="185" rx="45" ry="8" fill="#48BFE3" opacity="0.2" />
  
  <!-- Main body -->
  <path d="M45 150 C20 135, 12 95, 35 60 C50 38, 85 22, 115 25 C150 29, 178 52, 175 88 C173 112, 162 138, 145 155 C125 172, 70 168, 45 150 Z" 
        fill="#48BFE3" />
  
  <!-- Body highlight -->
  <path d="M65 55 C80 38, 105 32, 125 38 C140 43, 150 55, 148 65 C140 55, 120 45, 95 43 C78 42, 68 48, 65 55 Z" 
        fill="#72EFDD" opacity="0.4" />
  
  <!-- Left eyebrow -->
  <path d="M70 62 C76 57, 88 56, 95 60" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Right eyebrow -->
  <path d="M120 58 C126 53, 138 53, 145 58" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Left eye -->
  <ellipse cx="85" cy="82" rx="14" ry="16" fill="white" />
  <ellipse cx="88" cy="84" rx="8" ry="9" fill="#5E60CE" />
  <ellipse cx="88" cy="84" rx="5" ry="6" fill="#3A0CA3" />
  <circle cx="92" cy="79" r="3" fill="white" />
  <circle cx="85" cy="87" r="1.5" fill="white" opacity="0.6" />
  
  <!-- Right eye -->
  <ellipse cx="135" cy="78" rx="14" ry="16" fill="white" />
  <ellipse cx="138" cy="80" rx="8" ry="9" fill="#5E60CE" />
  <ellipse cx="138" cy="80" rx="5" ry="6" fill="#3A0CA3" />
  <circle cx="142" cy="75" r="3" fill="white" />
  <circle cx="135" cy="83" r="1.5" fill="white" opacity="0.6" />
  
  <!-- Nose -->
  <ellipse cx="110" cy="98" rx="4" ry="3" fill="#3AB8D8" />
  
  <!-- Mouth - open as if speaking/pronouncing -->
  <ellipse cx="112" cy="118" rx="12" ry="10" fill="white" />
  <path d="M100 118 C100 118, 106 126, 112 126 C118 126, 124 118, 124 118" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 118 C106 112, 118 112, 124 118" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  <!-- Tongue -->
  <ellipse cx="112" cy="122" rx="5" ry="3" fill="#FF8FAB" opacity="0.5" />
  
  <!-- Cheek blush -->
  <ellipse cx="68" cy="103" rx="8" ry="5" fill="#80FFDB" opacity="0.4" />
  <ellipse cx="152" cy="98" rx="8" ry="5" fill="#80FFDB" opacity="0.4" />
  
  <!-- Gesturing hand -->
  <path d="M160 70 C165 60, 172 56, 176 60 C180 64, 177 72, 172 76 C168 79, 163 75, 160 70 Z" 
        fill="#56CFE1" />
  
  <!-- Speech bubble with "ABC" -->
  <rect x="145" y="8" width="50" height="30" rx="12" fill="white" stroke="#72EFDD" stroke-width="1.5" />
  <path d="M155 38 L152 44 L160 38" fill="white" stroke="#72EFDD" stroke-width="1.5" />
  <!-- Letters in bubble -->
  <text x="158" y="27" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5E60CE">A</text>
  <text x="170" y="27" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#48BFE3">B</text>
  <text x="181" y="27" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5390D9">C</text>
  
  <!-- Sound waves emanating from mouth -->
  <path d="M130 115 C135 112, 138 118, 135 122" fill="none" stroke="#72EFDD" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M136 110 C142 106, 146 116, 142 122" fill="none" stroke="#80FFDB" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M140 105 C148 100, 153 113, 148 120" fill="none" stroke="#80FFDB" stroke-width="1" stroke-linecap="round" opacity="0.3" />
</svg>
