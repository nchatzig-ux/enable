<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Able - Excited/Surprised variation -->
  
  <!-- Shadow/ground -->
  <ellipse cx="105" cy="185" rx="40" ry="7" fill="#48BFE3" opacity="0.15" />
  
  <!-- Jump sparkles -->
  <circle cx="35" cy="40" r="3" fill="#80FFDB" opacity="0.6" />
  <circle cx="170" cy="30" r="2.5" fill="#72EFDD" opacity="0.7" />
  <circle cx="25" cy="70" r="2" fill="#72EFDD" opacity="0.5" />
  <path d="M160 50 L163 43 L166 50 L173 47 L168 53 L175 56 L168 57 L170 64 L165 59 L162 66 L161 58 L155 60 L159 54 L153 52 L159 50 Z" 
        fill="#80FFDB" opacity="0.6" />
  <path d="M30 55 L32 50 L34 55 L38 53 L36 57 L40 58 L36 59 L37 63 L34 60 L32 64 L31 59 L27 60 L30 57 L27 56 Z" 
        fill="#72EFDD" opacity="0.5" />
  
  <!-- Main body - slightly squished (bouncing up) -->
  <path d="M42 148 C18 132, 14 92, 38 58 C54 35, 88 20, 118 24 C152 28, 180 50, 177 87 C175 112, 163 136, 147 152 C127 170, 68 167, 42 148 Z" 
        fill="#48BFE3" />
  
  <!-- Body highlight -->
  <path d="M62 50 C80 34, 108 28, 130 35 C145 40, 155 52, 152 62 C143 50, 122 42, 98 40 C80 39, 66 44, 62 50 Z" 
        fill="#72EFDD" opacity="0.4" />
  
  <!-- Raised eyebrows - high up for surprise -->
  <path d="M65 55 C72 48, 86 47, 95 52" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M118 50 C126 44, 140 44, 148 50" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Left eye - wide open, excited -->
  <ellipse cx="83" cy="78" rx="15" ry="18" fill="white" />
  <ellipse cx="86" cy="79" rx="9" ry="10" fill="#5E60CE" />
  <ellipse cx="86" cy="79" rx="6" ry="7" fill="#3A0CA3" />
  <circle cx="90" cy="74" r="3.5" fill="white" />
  <circle cx="83" cy="83" r="1.5" fill="white" opacity="0.6" />
  <!-- Sparkle in eye -->
  <path d="M78 72 L79 70 L80 72 L82 71 L80 73 L82 74 L80 74 L79 76 L78 74 L76 74 L78 73 Z" fill="white" opacity="0.8" />
  
  <!-- Right eye - wide open, excited -->
  <ellipse cx="137" cy="74" rx="15" ry="18" fill="white" />
  <ellipse cx="140" cy="75" rx="9" ry="10" fill="#5E60CE" />
  <ellipse cx="140" cy="75" rx="6" ry="7" fill="#3A0CA3" />
  <circle cx="144" cy="70" r="3.5" fill="white" />
  <circle cx="137" cy="79" r="1.5" fill="white" opacity="0.6" />
  <!-- Sparkle in eye -->
  <path d="M132 68 L133 66 L134 68 L136 67 L134 69 L136 70 L134 70 L133 72 L132 70 L130 70 L132 69 Z" fill="white" opacity="0.8" />
  
  <!-- Nose -->
  <ellipse cx="110" cy="97" rx="4" ry="3" fill="#3AB8D8" />
  
  <!-- Mouth - open excited smile (like saying "wow!") -->
  <ellipse cx="112" cy="120" rx="16" ry="13" fill="#3A0CA3" opacity="0.2" />
  <path d="M96 115 C100 125, 108 132, 114 132 C120 132, 128 125, 130 115" 
        fill="white" opacity="0.9" />
  <path d="M96 115 C100 125, 108 132, 114 132 C120 132, 128 125, 130 115" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Cheek blush - bigger when excited -->
  <ellipse cx="62" cy="102" rx="9" ry="6" fill="#80FFDB" opacity="0.5" />
  <ellipse cx="155" cy="97" rx="9" ry="6" fill="#80FFDB" opacity="0.5" />
  
  <!-- Both hands raised in excitement -->
  <path d="M168 48 C173 35, 182 32, 186 37 C190 42, 187 52, 180 57 C175 61, 170 56, 168 48 Z" 
        fill="#56CFE1" />
  <path d="M183 30 C186 24, 190 22, 192 26 C194 30, 191 35, 187 37" 
        fill="#56CFE1" />
  <!-- Left hand up -->
  <path d="M35 55 C30 42, 22 38, 18 43 C14 48, 18 58, 24 62 C29 65, 33 61, 35 55 Z" 
        fill="#56CFE1" />
  <path d="M20 36 C17 30, 13 28, 11 32 C9 36, 13 40, 17 42" 
        fill="#56CFE1" />
  
  <!-- Exclamation energy lines -->
  <path d="M50 30 L48 20" fill="none" stroke="#72EFDD" stroke-width="2" stroke-linecap="round" />
  <path d="M60 25 L60 15" fill="none" stroke="#80FFDB" stroke-width="2" stroke-linecap="round" />
  <path d="M145 25 L147 15" fill="none" stroke="#72EFDD" stroke-width="2" stroke-linecap="round" />
  <path d="M155 30 L158 20" fill="none" stroke="#80FFDB" stroke-width="2" stroke-linecap="round" />
</svg>