<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <!-- Enable Full Logo - Structured with Playful Twist Typography + improved Able -->
  
  <!-- Able Mascot (scaled to fit alongside wordmark) -->
  <g transform="translate(5, 10) scale(0.9)">
    <!-- Shadow/ground -->
    <ellipse cx="100" cy="185" rx="40" ry="6" fill="#48BFE3" opacity="0.15" />
    
    <!-- Main body -->
    <path d="M45 150 C20 135, 12 95, 35 60 C50 38, 85 22, 115 25 C150 29, 178 52, 175 88 C173 112, 162 138, 145 155 C125 172, 70 168, 45 150 Z" 
          fill="#48BFE3" />
    
    <!-- Body highlight -->
    <path d="M65 55 C80 38, 105 32, 125 38 C140 43, 150 55, 148 65 C140 55, 120 45, 95 43 C78 42, 68 48, 65 55 Z" 
          fill="#72EFDD" opacity="0.4" />
    
    <!-- Movement trails -->
    <path d="M25 110 C10 105, 5 88, 15 75 C22 66, 18 80, 12 88 C6 98, 12 108, 25 110 Z" 
          fill="#72EFDD" opacity="0.7" />
    <path d="M18 130 C8 127, 4 118, 9 108 C12 103, 10 112, 7 117 C4 123, 8 128, 18 130 Z" 
          fill="#80FFDB" opacity="0.5" />
    
    <!-- Left eyebrow -->
    <path d="M70 62 C76 57, 88 56, 95 60" 
          fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Right eyebrow -->
    <path d="M120 58 C126 53, 138 53, 145 58" 
          fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Left eye -->
    <ellipse cx="85" cy="82" rx="14" ry="16" fill="white" />
    <ellipse cx="88" cy="84" rx="8" ry="9" fill="#5E60CE" />
    <ellipse cx="88" cy="84" rx="5" ry="6" fill="#3A0CA3" />
    <circle cx="92" cy="79" r="3" fill="white" />
    <circle cx="85" cy="87" r="1.5" fill="white" opacity="0.6" />
    
    <!-- Right eye -->
    <ellipse cx="135" cy="78" rx="14" ry="16" fill="white" />
    <ellipse cx="138" cy="80" rx="8" ry="9" fill="#5E60CE" />
    <ellipse cx="138" cy="80" rx="5" ry="6" fill="#3A0CA3" />
    <circle cx="142" cy="75" r="3" fill="white" />
    <circle cx="135" cy="83" r="1.5" fill="white" opacity="0.6" />
    
    <!-- Nose -->
    <ellipse cx="110" cy="100" rx="4" ry="3" fill="#3AB8D8" />
    
    <!-- Smile -->
    <path d="M90 115 C100 128, 125 128, 138 115" 
          fill="none" stroke="#5E60CE" stroke-width="3" stroke-linecap="round" />
    <path d="M95 117 C103 125, 122 125, 133 117" 
          fill="#3A0CA3" opacity="0.15" />
    
    <!-- Cheek blush -->
    <ellipse cx="70" cy="105" rx="8" ry="5" fill="#80FFDB" opacity="0.4" />
    <ellipse cx="150" cy="100" rx="8" ry="5" fill="#80FFDB" opacity="0.4" />
    
    <!-- Wave hand -->
    <path d="M165 55 C170 42, 180 38, 185 43 C190 48, 187 58, 180 63 C175 67, 168 63, 165 55 Z" 
          fill="#56CFE1" />
    <path d="M180 38 C183 32, 188 30, 190 34 C192 38, 189 42, 185 43" 
          fill="#56CFE1" />
    
    <!-- Speech dots -->
    <circle cx="183" cy="28" r="4.5" fill="#72EFDD" />
    <circle cx="190" cy="18" r="3.5" fill="#80FFDB" />
    <circle cx="194" cy="9" r="2.5" fill="#80FFDB" opacity="0.7" />
  </g>
  
  <!-- "Enable" wordmark - Structured/Bold with Playful Twist -->
  <g transform="translate(200, 55)">
    <!-- E - bold structured, slight tilt -->
    <g transform="rotate(-2, 25, 45)">
      <rect x="5" y="8" width="12" height="72" rx="2" fill="#5390D9" />
      <rect x="5" y="8" width="42" height="12" rx="2" fill="#5390D9" />
      <rect x="5" y="38" width="35" height="11" rx="2" fill="#5390D9" />
      <rect x="5" y="68" width="42" height="12" rx="2" fill="#5390D9" />
    </g>
    
    <!-- n - structured with rounded joints -->
    <g transform="rotate(1, 75, 50)">
      <rect x="58" y="30" width="11" height="50" rx="2" fill="#48BFE3" />
      <path d="M63 30 C63 30, 70 22, 82 22 C94 22, 100 30, 100 40 L100 80 L89 80 L89 42 C89 36, 86 32, 80 32 C74 32, 69 36, 69 40" 
            fill="#48BFE3" />
    </g>
    
    <!-- a - geometric with open counter -->
    <g transform="rotate(-1, 125, 50)">
      <path d="M108 58 C108 48, 114 40, 124 40 L124 30 C113 30, 104 37, 104 50 L104 68 C104 75, 110 82, 120 82 C130 82, 136 75, 136 68 L136 30 L125 30 L125 68 C125 72, 123 74, 120 74 C115 74, 112 72, 112 68 L108 58 Z" 
            fill="#48BFE3" />
      <rect x="125" y="28" width="11" height="52" rx="2" fill="#48BFE3" />
    </g>
    
    <!-- b - bold, structured -->
    <g transform="rotate(1.5, 170, 45)">
      <rect x="148" y="5" width="11" height="75" rx="2" fill="#5E60CE" />
      <path d="M159 38 C165 30, 172 28, 180 28 C192 28, 200 38, 200 54 C200 70, 192 80, 180 80 C172 80, 165 77, 159 70 Z M159 54 C159 64, 166 72, 176 72 C186 72, 191 64, 191 54 C191 44, 186 36, 176 36 C166 36, 159 44, 159 54 Z" 
            fill="#5E60CE" />
    </g>
    
    <!-- l - simple tall stroke -->
    <g transform="rotate(-1, 218, 45)">
      <rect x="212" y="5" width="11" height="75" rx="2" fill="#5E60CE" />
    </g>
    
    <!-- e - geometric with clean cut -->
    <g transform="rotate(1, 255, 50)">
      <path d="M234 54 C234 40, 243 28, 258 28 C273 28, 281 40, 281 52 L281 56 L245 56 C246 66, 252 72, 262 72 C268 72, 273 69, 276 66 L282 73 C277 78, 270 82, 261 82 C244 82, 234 70, 234 54 Z M245 47 L271 47 C270 39, 265 34, 258 34 C251 34, 246 39, 245 47 Z" 
            fill="#48BFE3" />
    </g>
  </g>
  
  <!-- Playful accent swoosh -->
  <path d="M205 160 C245 165, 350 168, 490 155" 
        fill="none" stroke="#72EFDD" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>