<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Able - Jumping/Celebrating variation -->
  
  <!-- Shadow/ground - smaller and further down (he's in the air!) -->
  <ellipse cx="100" cy="192" rx="30" ry="5" fill="#48BFE3" opacity="0.15" />
  
  <!-- Motion lines below (showing upward movement) -->
  <path d="M75 175 L75 185" fill="none" stroke="#72EFDD" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M100 178 L100 190" fill="none" stroke="#80FFDB" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <path d="M125 175 L125 185" fill="none" stroke="#72EFDD" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  
  <!-- Confetti/celebration particles -->
  <rect x="25" y="30" width="5" height="5" rx="1" fill="#7400B8" opacity="0.6" transform="rotate(30, 27, 32)" />
  <rect x="170" y="20" width="4" height="6" rx="1" fill="#5E60CE" opacity="0.6" transform="rotate(-20, 172, 23)" />
  <rect x="40" y="15" width="4" height="4" rx="1" fill="#72EFDD" opacity="0.7" transform="rotate(45, 42, 17)" />
  <rect x="155" y="45" width="5" height="4" rx="1" fill="#80FFDB" opacity="0.6" transform="rotate(15, 157, 47)" />
  <circle cx="180" cy="55" r="2.5" fill="#6930C3" opacity="0.5" />
  <circle cx="20" cy="50" r="2" fill="#5390D9" opacity="0.5" />
  <path d="M50 20 L52 14 L54 20 L58 18 L55 22 L59 24 L55 25 L56 29 L53 26 L51 30 L50 26 L46 27 L49 24 L46 22 L50 21 Z" 
        fill="#80FFDB" opacity="0.7" />
  <path d="M160 10 L161 6 L163 10 L166 8 L164 11 L167 13 L164 13 L165 16 L162 14 L161 17 L160 14 L157 15 L159 12 L157 11 Z" 
        fill="#72EFDD" opacity="0.6" />
  
  <!-- Main body - stretched vertically (jumping up) -->
  <path d="M45 155 C20 140, 15 98, 38 60 C52 38, 85 22, 115 25 C148 29, 178 50, 175 87 C173 110, 162 135, 147 152 C128 170, 68 170, 45 155 Z" 
        fill="#48BFE3" />
  
  <!-- Body highlight -->
  <path d="M60 52 C78 36, 106 29, 128 35 C143 40, 153 52, 150 62 C142 50, 120 43, 96 41 C78 40, 64 45, 60 52 Z" 
        fill="#72EFDD" opacity="0.4" />
  
  <!-- Eyebrows - happy arches -->
  <path d="M66 58 C73 52, 87 51, 95 55" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M120 54 C127 48, 141 48, 149 53" 
        fill="none" stroke="#5E60CE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Left eye - happy squint (closed-happy) -->
  <path d="M72 80 C78 72, 90 72, 96 80" 
        fill="none" stroke="#5E60CE" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Right eye - happy squint (closed-happy) -->
  <path d="M125 76 C131 68, 143 68, 149 76" 
        fill="none" stroke="#5E60CE" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Nose -->
  <ellipse cx="110" cy="95" rx="4" ry="3" fill="#3AB8D8" />
  
  <!-- Mouth - big open celebratory smile -->
  <path d="M88 110 C98 130, 120 130, 135 110" 
        fill="white" opacity="0.9" />
  <path d="M88 110 C98 130, 120 130, 135 110" 
        fill="none" stroke="#5E60CE" stroke-width="2.8" stroke-linecap="round" />
  <!-- Tongue hint -->
  <ellipse cx="112" cy="122" rx="7" ry="4" fill="#FF6B9D" opacity="0.4" />
  
  <!-- Cheek blush - rosy from excitement -->
  <ellipse cx="64" cy="98" rx="9" ry="6" fill="#80FFDB" opacity="0.5" />
  <ellipse cx="155" cy="93" rx="9" ry="6" fill="#80FFDB" opacity="0.5" />
  
  <!-- Both arms raised high - celebration! -->
  <!-- Right arm -->
  <path d="M165 45 C172 30, 182 26, 186 32 C190 38, 186 48, 178 52 C173 55, 168 50, 165 45 Z" 
        fill="#56CFE1" />
  <path d="M183 24 C186 18, 191 17, 193 21 C195 25, 192 30, 188 32" 
        fill="#56CFE1" />
  
  <!-- Left arm -->
  <path d="M32 50 C26 36, 17 32, 13 37 C9 43, 14 52, 21 56 C26 59, 30 55, 32 50 Z" 
        fill="#56CFE1" />
  <path d="M15 30 C12 24, 8 22, 6 26 C4 30, 8 35, 12 37" 
        fill="#56CFE1" />
  
  <!-- Little feet kicking (showing jump) -->
  <ellipse cx="80" cy="168" rx="10" ry="6" fill="#3AB8D8" transform="rotate(-15, 80, 168)" />
  <ellipse cx="125" cy="168" rx="10" ry="6" fill="#3AB8D8" transform="rotate(15, 125, 168)" />
</svg>