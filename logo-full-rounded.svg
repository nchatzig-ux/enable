<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <!-- Enable Full Logo - Rounded/Soft Typography -->
  
  <!-- Able Mascot (scaled down) -->
  <g transform="translate(10, 15) scale(0.85)">
    <!-- Main body -->
    <path d="M60 140 C30 130, 20 95, 40 65 C55 40, 90 30, 120 35 C150 40, 175 60, 170 90 C167 110, 155 130, 140 145 C120 162, 80 155, 60 140 Z" 
          fill="#48BFE3" />
    
    <!-- Movement trails -->
