          fill="#5E60CE" />
    
    <!-- l -->
    <path d="M218 10 C218 7, 220 5, 223 5 C226 5, 228 7, 228 10 L228 74 C228 77, 226 80, 223 80 C220 80, 218 77, 218 74 Z" 
          fill="#5E60CE" />
    
    <!-- e -->
    <path d="M240 54 C240 38, 250 28, 263 28 C276 28, 285 38, 285 52 C285 55, 283 57, 280 57 L250 57 C251 65, 257 70, 266 70 C271 70, 275 68, 278 65 C280 63, 282 63, 284 65 C286 67, 285 70, 283 72 C278 77, 272 80, 264 80 C249 80, 240 70, 240 54 Z M250 48 L275 48 C274 41, 270 37, 263 37 C256 37, 252 41, 250 48 Z" 
          fill="#48BFE3" />
