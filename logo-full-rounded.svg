    <ellipse cx="92" cy="84" rx="5" ry="6" fill="#5E60CE" />
    <circle cx="94" cy="81" r="2" fill="white" />
    
    <!-- Right eye -->
    <ellipse cx="130" cy="78" rx="10" ry="12" fill="white" />
    <ellipse cx="132" cy="80" rx="5" ry="6" fill="#5E60CE" />
    <circle cx="134" cy="77" r="2" fill="white" />
    
    <!-- Smile -->
    <path d="M95 108 C105 120, 125 120, 135 108" 
          fill="none" stroke="#5E60CE" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Wave hand -->
    <path d="M160 60 C165 50, 172 48, 176 52 C180 56, 178 64, 172 68 C168 71, 163 68, 160 60 Z" 
          fill="#56CFE1" />
    
    <!-- Speech dots -->
    <circle cx="175" cy="42" r="4" fill="#72EFDD" />
    <circle cx="182" cy="34" r="3" fill="#80FFDB" />
    <circle cx="186" cy="25" r="2.5" fill="#80FFDB" opacity="0.7" />
  </g>
  
  <!-- "Enable" wordmark - Rounded/Soft style -->
