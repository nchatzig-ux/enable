          fill="#72EFDD" opacity="0.7" />
    <path d="M28 120 C18 118, 14 110, 18 102 C20 98, 19 105, 16 109 C13 114, 16 118, 28 120 Z" 
          fill="#80FFDB" opacity="0.5" />
    
    <!-- Left eye -->
